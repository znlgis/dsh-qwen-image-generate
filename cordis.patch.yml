- insert:
    - id: dsh-qwen-image-generate
      name: "@dsh-gis/dsh-qwen-image-generate"
      config:
        # Credential reference resolved through the DSH credential store (falling
        # back to the launch environment, the project's .env, and the harness-home
        # .env). This profile already stores the Token Plan key under
        # DASHSCOPE_API_KEY; point the reference at another name to keep the
        # plan key apart from a DashScope key. Never put the sk-sp- key here.
        apiKeyEnv: DASHSCOPE_API_KEY
        baseUrl: https://token-plan.maas.qianwenaiapi.com/api/v1/services/aigc/multimodal-generation/generation
        defaultModel: wan2.7-image-pro
        defaultSize: 1024*1024
        # Keep this under the host's default 120 s per-call timeout: a synchronous
        # image call has no task id to resume, so a budget the host outlives
        # loses a paid result.
        timeoutMs: 110000
        # Asynchronous video-synthesis endpoint. The task-query URL
        # (@ .../tasks/{task_id}) is derived from this path, so keep the whole
        # /services/aigc/video-generation/video-synthesis suffix.
        videoBaseUrl: https://token-plan.maas.qianwenaiapi.com/api/v1/services/aigc/video-generation/video-synthesis
        defaultVideoModel: wan3.0-video
        defaultVideoResolution: 720P
        defaultVideoRatio: "16:9"
        defaultVideoDuration: 5
        videoTimeoutMs: 180000
        videoPollIntervalMs: 5000
        # Keep this under the host's default 120 s per-call timeout: a longer
        # poll window leaves the task running (and billed) while the process is
        # killed mid-poll, losing the task id.
        videoWaitMs: 90000
